name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        c_compiler: [gcc, clang-21]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            cpp_flags: "-Wno-non-template-friend -Wno-sfinae-incomplete"
          - os: ubuntu-latest
            c_compiler: clang-21
            cpp_compiler: clang++-21
            cpp_flags: "-stdlib=libc++"
        exclude: []

    steps:
    - uses: actions/checkout@v4

    - name: Install CMake
      uses: ssrobins/install-cmake@v1
      with:
        version: 4.1.1
    - name: Install Clang 21
      if: matrix.c_compiler == 'clang-21'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21
        sudo apt-get install -y libc++-21-dev libblocksruntime-dev
    - name: Install GCC
      if: matrix.c_compiler == 'gcc'
      run: |
        wget --quiet https://kayari.org/gcc-latest/gcc-latest.deb \
        && sudo dpkg -i gcc-latest.deb
        echo "/opt/gcc-latest/bin" >> $GITHUB_PATH
        echo "LD_RUN_PATH=/opt/gcc-latest/lib64" >> $GITHUB_ENV

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_FLAGS=${{ matrix.cpp_flags }}
        -S ${{ github.workspace }}/all

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --output-on-failure --build-config ${{ matrix.build_type }}
